<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>LOVE SCAN | LOUNGE MARE</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#fff;background:#100b14}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#421b3a 0%,#160c1c 45%,#08070b 100%)}.app{max-width:480px;margin:auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 26px);display:flex;flex-direction:column}.brand{text-align:center;font-size:11px;letter-spacing:.32em;color:#dbb878;font-weight:700}.heading{text-align:center;font-size:clamp(28px,8vw,41px);letter-spacing:.08em;font-weight:900;margin:9px 0 4px;text-shadow:0 0 30px #ef4d9660}.sub{text-align:center;color:#e7b6cc;font-size:12px;letter-spacing:.13em;margin:0 0 20px}.stage{position:relative;width:100%;aspect-ratio:3/4;max-height:58dvh;overflow:hidden;border-radius:22px;border:1px solid #b17c9b;background:#1e1421;box-shadow:0 0 0 4px #ffffff07,0 18px 60px #0009,0 0 35px #f4427b1a}.stage video,.stage canvas.preview{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;transform:scaleX(-1)}.stage canvas.preview{transform:none}.stage .tint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0b07113b,transparent 25%,transparent 70%,#0b07117b)}.frame{position:absolute;inset:0;pointer-events:none}.face{position:absolute;top:21%;width:34%;height:37%;border:1.5px dashed #f4d7a6aa;border-radius:48% 48% 44% 44%;filter:drop-shadow(0 0 8px #ed7eaf)}.face.left{left:12%}.face.right{right:12%}.corner{position:absolute;width:35px;height:35px;border-color:#e6b977}.tl{left:13px;top:13px;border-top:3px solid;border-left:3px solid;border-radius:10px 0 0}.tr{right:13px;top:13px;border-top:3px solid;border-right:3px solid;border-radius:0 10px 0 0}.bl{left:13px;bottom:13px;border-bottom:3px solid;border-left:3px solid;border-radius:0 0 0 10px}.br{right:13px;bottom:13px;border-bottom:3px solid;border-right:3px solid;border-radius:0 0 10px}.stage-label{position:absolute;bottom:20px;width:100%;text-align:center;color:#f8d3e5;font-size:11px;letter-spacing:.2em;text-shadow:0 2px 5px #000}.scanline{position:absolute;left:0;right:0;height:4px;top:0;background:#ff86c0;box-shadow:0 0 15px 6px #ff5b9b,0 0 40px 12px #fa4e8955;animation:sweep 1.35s ease-in-out infinite alternate;display:none}.scanning .scanline{display:block}@keyframes sweep{from{top:9%}to{top:91%}}.pulse{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#160a1a66;backdrop-filter:blur(2px)}.scanning .pulse{display:flex}.pulse .heart{font-size:60px;color:#ff80ae;animation:beat .7s infinite alternate;text-shadow:0 0 24px #ff3d88}@keyframes beat{to{transform:scale(1.25)}}.pulse p{font-size:12px;letter-spacing:.2em}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:flash .35s ease-out}@keyframes flash{15%{opacity:.95}100%{opacity:0}}.actions{display:flex;flex-direction:column;gap:10px;margin-top:19px}.btn{appearance:none;border:0;border-radius:999px;min-height:55px;padding:12px 20px;font-weight:800;font-size:15px;letter-spacing:.05em;cursor:pointer}.primary{color:#2a101e;background:linear-gradient(105deg,#f4c5d9,#ef6b9e 50%,#d9a85e);box-shadow:0 8px 28px #ef5d9455}.secondary{background:#ffffff12;color:#f5dce9;border:1px solid #e1a5be55}.btn:disabled{opacity:.45}.note{text-align:center;font-size:11px;line-height:1.8;color:#bcaebd;margin:15px 6px 0}.result{display:none;text-align:center}.result.show{display:block}.result .score{font-size:clamp(65px,19vw,95px);line-height:1.1;color:#ff94be;font-weight:900;text-shadow:0 0 25px #ff519caa;animation:appear .65s both}@keyframes appear{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}.result .tag{color:#e3bd7e;letter-spacing:.18em;font-size:11px;margin:12px 0}.result .message{font-size:19px;font-weight:800;margin:5px 0 12px}.result-photo{width:100%;border-radius:17px;max-height:43dvh;object-fit:contain;background:#0c0b0e}.hidden{display:none!important}.status{text-align:center;color:#ffc9d9;font-size:12px;min-height:18px;margin-top:8px}.sparkles{position:fixed;inset:0;pointer-events:none;overflow:hidden}.sparkles span{position:absolute;font-size:24px;animation:float 2.5s ease-out forwards}@keyframes float{from{transform:translateY(0) scale(.4);opacity:1}to{transform:translateY(-65vh) rotate(45deg) scale(1.6);opacity:0}}.privacy{margin-top:auto;padding-top:15px;text-align:center;color:#c4a9b7;font-size:10px}.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f2c5dc;font-size:13px;text-align:center;padding:24px}

/* MARE refined edition */
:root{color:#f4f0e8;background:#08090a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
body{background:radial-gradient(ellipse at 50% -20%,#29241c 0%,#111111 43%,#08090a 100%)}

/* Final restrained black / champagne-gold direction */
body{background:radial-gradient(ellipse at 50% -12%,#252018 0%,#11100e 36%,#090909 76%)}
.heading{margin-bottom:9px;font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:.12em;color:#f7f4ee;text-shadow:none}

.stage{border:1px solid #827255;background:#111111;box-shadow:0 22px 56px #0009}

/* Experience upgrades */
.stage{width:100%;max-width:100%;max-height:54dvh;aspect-ratio:3/4;isolation:isolate}
.stage video,.stage canvas.preview{object-fit:contain;background:#080808}
.stage .frame{inset:0}.stage .face{top:19%;height:38%}
.countdown{position:absolute;inset:0;z-index:8;display:none;place-items:center;background:#0007;color:#f3d9a6;font:normal clamp(92px,28vw,150px) Georgia,serif;text-shadow:0 0 36px #e4bd72}

</style></head><body><main class="app"><div class="brand">LOUNGE MARE</div><h1 class="heading">LOVE SCAN</h1><p class="sub">キャストとの相性をチェック</p><p class="intro">今夜の相性、何％？</p><section id="cameraSection"><div class="stage" id="stage"><video id="video" autoplay muted playsinline></video><canvas id="photo" class="preview hidden"></canvas><div class="tint"></div><div class="frame"><div class="face left"></div><div class="face right"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div></div><div class="scanline"></div><div class="pulse"><div class="heart">♥</div><p id="scanText">COMPATIBILITY ANALYSIS</p></div><div class="flash" id="flash"></div><div class="countdown" id="countdown" aria-live="polite"></div><div class="stage-label" id="stageLabel">ふたりでフレームに入ってください</div><div id="loading" class="loading">カメラを準備中…</div></div><div class="status" id="status" role="status"></div><div class="actions"><button class="btn primary" id="shoot" disabled>診断スタート</button><button class="btn secondary hidden" id="retry">撮り直す</button></div></section><section class="result" id="result"><div class="tag">MATCH RESULT</div><div class="score" id="score">88%</div><div class="message" id="message">このふたり、相性抜群！</div><img id="resultPhoto" class="result-photo" alt="撮影したツーショット"><div class="actions"><button class="btn primary" id="save">結果を画像で保存</button><button class="btn secondary" id="again">もう一度診断する</button></div></section><p class="note">エンタメとして楽しんでね。</p><div class="privacy">写真は端末内のみで処理され、サーバーには送信されません</div></main><div id="sparkles" class="sparkles"></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const video=$('video'),photo=$('photo'),stage=$('stage'),shoot=$('shoot'),retry=$('retry'),status=$('status'),loading=$('loading');let stream=null,shot=null,score=88,busy=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));function sound(freq=450,duration=.13){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ctx=new A(),o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.65,ctx.currentTime+duration);g.gain.setValueAtTime(.055,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration);o.onended=()=>ctx.close()}catch{}}async function startCamera(){status.textContent='';loading.classList.remove('hidden');shoot.disabled=true;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('この環境ではカメラを利用できません。HTTPSで開いてください。');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:1280},height:{ideal:1706}}});video.srcObject=stream;await video.play();const ratio=video.videoWidth/video.videoHeight;stage.style.aspectRatio=String(ratio);stage.style.width=`min(100%, ${Math.floor(54*ratio)}dvh)`;stage.style.marginInline='auto';loading.classList.add('hidden');shoot.disabled=false}catch(e){loading.classList.add('hidden');status.textContent='カメラを使えません。ブラウザのカメラ許可とHTTPS接続を確認してください。';console.warn(e)}}function capture(){const w=900,h=Math.round(900*video.videoHeight/video.videoWidth);photo.width=w;photo.height=h;const ctx=photo.getContext('2d');const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)throw Error('カメラの準備ができていません');const scale=Math.min(w/vw,h/vh),dw=vw*scale,dh=vh*scale,dx=(w-dw)/2,dy=(h-dh)/2;ctx.fillStyle='#0c0d0e';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,vw,vh,dx,dy,dw,dh);ctx.restore();shot=document.createElement('canvas');shot.width=w;shot.height=h;shot.getContext('2d').drawImage(photo,0,0);video.classList.add('hidden');photo.classList.remove('hidden');}function scorePick(){const arr=new Uint32Array(1);if(crypto?.getRandomValues){crypto.getRandomValues(arr);return 84+(arr[0]%15)}return 84+Math.floor(Math.random()*15)}function confetti(){const root=$('sparkles');root.replaceChildren();for(let i=0;i<28;i++){const s=document.createElement('span');s.textContent=i%3?'✧':'·';s.style.left=(5+Math.random()*90)+'%';s.style.top=(60+Math.random()*35)+'%';s.style.color=i%2?'#e4c58d':'#ffffff';s.style.animationDelay=Math.random()*.5+'s';root.appendChild(s)}setTimeout(()=>root.replaceChildren(),3400)}async function run(){if(busy)return;busy=true;shoot.disabled=true;try{const counter=$('countdown');for(let n=3;n>=1;n--){counter.textContent=n;counter.classList.remove('active');void counter.offsetWidth;counter.classList.add('active');sound(480+n*70,.11);await sleep(850)}counter.classList.remove('active');capture();$('flash').classList.add('go');sound(850,.13);await sleep(400);stage.classList.add('scanning');$('stageLabel').textContent='';for(let i=0;i<5;i++){ $('scanText').textContent=['PAIR DETECTED','SCANNING...','CHECKING CONNECTION','CALCULATING...','RESULT READY'][i];sound(350+i*85,.1);await sleep(680)}stage.classList.remove('scanning');score=scorePick();$('score').textContent=score+'%';$('message').textContent=score>=95?'最強のふたり♡ 永久指名♡':score>=93?'こんなに気が合うなんて、今夜は帰れないかも！':score>=90?'このふたり、今夜いちばん盛り上がりそう！':score>=87?'あなたと飲むと、つい笑顔になっちゃう！':'話してるだけで、あっという間に時間が過ぎそう！';$('resultPhoto').src=shot.toDataURL('image/jpeg',.92);$('cameraSection').classList.add('hidden');$('result').classList.toggle('rare',score>=95);$('result').classList.add('show');sound(score>=95?1250:950,.32);if(score>=95){await sleep(130);sound(1600,.3)}confetti()}catch(e){status.textContent=e.message;retry.classList.remove('hidden')}finally{busy=false;shoot.disabled=false}}function drawResult(){
 const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');
 const bg=x.createLinearGradient(0,0,1080,1920);bg.addColorStop(0,'#252118');bg.addColorStop(.35,'#111110');bg.addColorStop(1,'#080808');x.fillStyle=bg;x.fillRect(0,0,1080,1920);
 x.textAlign='center';x.fillStyle='#cdb17c';x.font='500 29px sans-serif';x.fillText('L O U N G E   M A R E',540,102);
 x.fillStyle='#f4f0e9';x.font='normal 86px Georgia,serif';x.fillText('LOVE SCAN',540,210);
 const b={x:68,y:277,w:944,h:1180};x.fillStyle='#171716';x.fillRect(b.x,b.y,b.w,b.h);
 const fit=Math.min(b.w/shot.width,b.h/shot.height),w=shot.width*fit,h=shot.height*fit;
 x.drawImage(shot,b.x+(b.w-w)/2,b.y+(b.h-h)/2,w,h);
 x.strokeStyle='#aa9064';x.lineWidth=3;x.strokeRect(b.x,b.y,b.w,b.h);
 x.fillStyle='#0b0b0bf2';x.fillRect(68,1410,944,370);
 x.fillStyle='#cdb17c';x.font='500 27px sans-serif';x.fillText('COMPATIBILITY',540,1475);
 x.fillStyle=score>=95?'#fff0c1':'#e9d2a1';x.font='normal 146px Georgia,serif';x.fillText(score+'%',540,1625);
 const msg=$('message').textContent;const parts=msg.includes(' 永久指名')?msg.split(' '):[msg];
 x.fillStyle='#f4f0e9';x.font='500 36px sans-serif';parts.forEach((part,i)=>x.fillText(part,540,1690+i*48));
 x.fillStyle='#a99c84';x.font='25px sans-serif';x.fillText('エンタメとして楽しんでね。',540,1850);
 return c
}function save(){const c=drawResult();c.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LOVE_SCAN_'+score+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)},'image/png')}function reset(){stage.classList.remove('scanning');$('flash').classList.remove('go');$('countdown').classList.remove('active');$('result').classList.remove('rare');$('result').classList.remove('show');$('cameraSection').classList.remove('hidden');video.classList.remove('hidden');photo.classList.add('hidden');$('stageLabel').textContent='ふたりでフレームに入ってください';retry.classList.add('hidden');if(!stream||!stream.active)startCamera();else shoot.disabled=false}shoot.addEventListener('click',run);$('save').addEventListener('click',save);$('again').addEventListener('click',reset);retry.addEventListener('click',reset);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!stream?.active&&!busy&&$('result').classList.contains('show')===false)startCamera()});startCamera();})();
</script></body></html>
