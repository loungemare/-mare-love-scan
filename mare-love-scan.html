<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100b14"><title>MARE LOVE SCAN</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#fff;background:#100b14}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#421b3a 0%,#160c1c 45%,#08070b 100%)}.app{max-width:480px;margin:auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 26px);display:flex;flex-direction:column}.brand{text-align:center;font-size:11px;letter-spacing:.32em;color:#dbb878;font-weight:700}.heading{text-align:center;font-size:clamp(28px,8vw,41px);letter-spacing:.08em;font-weight:900;margin:9px 0 4px;text-shadow:0 0 30px #ef4d9660}.sub{text-align:center;color:#e7b6cc;font-size:12px;letter-spacing:.13em;margin:0 0 20px}.stage{position:relative;width:100%;aspect-ratio:3/4;max-height:58dvh;overflow:hidden;border-radius:22px;border:1px solid #b17c9b;background:#1e1421;box-shadow:0 0 0 4px #ffffff07,0 18px 60px #0009,0 0 35px #f4427b1a}.stage video,.stage canvas.preview{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transform:scaleX(-1)}.stage canvas.preview{transform:none}.stage .tint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0b07113b,transparent 25%,transparent 70%,#0b07117b)}.frame{position:absolute;inset:0;pointer-events:none}.face{position:absolute;top:21%;width:34%;height:37%;border:1.5px dashed #f4d7a6aa;border-radius:48% 48% 44% 44%;filter:drop-shadow(0 0 8px #ed7eaf)}.face.left{left:12%}.face.right{right:12%}.corner{position:absolute;width:35px;height:35px;border-color:#e6b977}.tl{left:13px;top:13px;border-top:3px solid;border-left:3px solid;border-radius:10px 0 0}.tr{right:13px;top:13px;border-top:3px solid;border-right:3px solid;border-radius:0 10px 0 0}.bl{left:13px;bottom:13px;border-bottom:3px solid;border-left:3px solid;border-radius:0 0 0 10px}.br{right:13px;bottom:13px;border-bottom:3px solid;border-right:3px solid;border-radius:0 0 10px}.stage-label{position:absolute;bottom:20px;width:100%;text-align:center;color:#f8d3e5;font-size:11px;letter-spacing:.2em;text-shadow:0 2px 5px #000}.scanline{position:absolute;left:0;right:0;height:4px;top:0;background:#ff86c0;box-shadow:0 0 15px 6px #ff5b9b,0 0 40px 12px #fa4e8955;animation:sweep 1.35s ease-in-out infinite alternate;display:none}.scanning .scanline{display:block}@keyframes sweep{from{top:9%}to{top:91%}}.pulse{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#160a1a66;backdrop-filter:blur(2px)}.scanning .pulse{display:flex}.pulse .heart{font-size:60px;color:#ff80ae;animation:beat .7s infinite alternate;text-shadow:0 0 24px #ff3d88}@keyframes beat{to{transform:scale(1.25)}}.pulse p{font-size:12px;letter-spacing:.2em}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:flash .35s ease-out}@keyframes flash{15%{opacity:.95}100%{opacity:0}}.actions{display:flex;flex-direction:column;gap:10px;margin-top:19px}.btn{appearance:none;border:0;border-radius:999px;min-height:55px;padding:12px 20px;font-weight:800;font-size:15px;letter-spacing:.05em;cursor:pointer}.primary{color:#2a101e;background:linear-gradient(105deg,#f4c5d9,#ef6b9e 50%,#d9a85e);box-shadow:0 8px 28px #ef5d9455}.secondary{background:#ffffff12;color:#f5dce9;border:1px solid #e1a5be55}.btn:disabled{opacity:.45}.note{text-align:center;font-size:11px;line-height:1.8;color:#bcaebd;margin:15px 6px 0}.result{display:none;text-align:center}.result.show{display:block}.result .score{font-size:clamp(65px,19vw,95px);line-height:1.1;color:#ff94be;font-weight:900;text-shadow:0 0 25px #ff519caa;animation:appear .65s both}@keyframes appear{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}.result .tag{color:#e3bd7e;letter-spacing:.18em;font-size:11px;margin:12px 0}.result .message{font-size:19px;font-weight:800;margin:5px 0 12px}.result-photo{width:100%;border-radius:17px;max-height:43dvh;object-fit:contain;background:#0c0b0e}.hidden{display:none!important}.status{text-align:center;color:#ffc9d9;font-size:12px;min-height:18px;margin-top:8px}.sparkles{position:fixed;inset:0;pointer-events:none;overflow:hidden}.sparkles span{position:absolute;font-size:24px;animation:float 2.5s ease-out forwards}@keyframes float{from{transform:translateY(0) scale(.4);opacity:1}to{transform:translateY(-65vh) rotate(45deg) scale(1.6);opacity:0}}.privacy{margin-top:auto;padding-top:15px;text-align:center;color:#c4a9b7;font-size:10px}.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f2c5dc;font-size:13px;text-align:center;padding:24px}
</style></head><body><main class="app"><div class="brand">LOUNGE MARE</div><h1 class="heading">LOVE SCAN ♡</h1><p class="sub">ふたりの相性、測ってみる？</p><section id="cameraSection"><div class="stage" id="stage"><video id="video" autoplay muted playsinline></video><canvas id="photo" class="preview hidden"></canvas><div class="tint"></div><div class="frame"><div class="face left"></div><div class="face right"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div></div><div class="scanline"></div><div class="pulse"><div class="heart">♥</div><p id="scanText">COMPATIBILITY SCANNING...</p></div><div class="flash" id="flash"></div><div class="stage-label" id="stageLabel">2人でインカメに映ってね ♡</div><div id="loading" class="loading">カメラを準備中…</div></div><div class="status" id="status" role="status"></div><div class="actions"><button class="btn primary" id="shoot" disabled>♡ ふたりの相性を測る</button><button class="btn secondary hidden" id="retry">撮り直す</button></div></section><section class="result" id="result"><div class="tag">YOUR COMPATIBILITY</div><div class="score" id="score">♡ 88%</div><div class="message" id="message">最高のコンビ♡</div><img id="resultPhoto" class="result-photo" alt="撮影したツーショット"><div class="actions"><button class="btn primary" id="save">♡ 結果画像を保存</button><button class="btn secondary" id="again">もう一度診断する</button></div></section><p class="note">相性スコアは80〜94%のエンタメ演出です。<br>実際の顔・性格・相性は解析しません。</p><div class="privacy">🔒 写真は端末内のみで処理・サーバーへ送信しません</div></main><div id="sparkles" class="sparkles"></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const video=$('video'),photo=$('photo'),stage=$('stage'),shoot=$('shoot'),retry=$('retry'),status=$('status'),loading=$('loading');let stream=null,shot=null,score=88,busy=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));function sound(freq=450,duration=.13){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ctx=new A(),o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.65,ctx.currentTime+duration);g.gain.setValueAtTime(.055,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration);o.onended=()=>ctx.close()}catch{}}async function startCamera(){status.textContent='';loading.classList.remove('hidden');shoot.disabled=true;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('この環境ではカメラを利用できません。HTTPSで開いてください。');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:1280},height:{ideal:1706}}});video.srcObject=stream;await video.play();loading.classList.add('hidden');shoot.disabled=false}catch(e){loading.classList.add('hidden');status.textContent='カメラを使えません。ブラウザのカメラ許可とHTTPS接続を確認してください。';console.warn(e)}}function capture(){const w=900,h=1200;photo.width=w;photo.height=h;const ctx=photo.getContext('2d');const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)throw Error('カメラの準備ができていません');const scale=Math.max(w/vw,h/vh),sw=w/scale,sh=h/scale,sx=(vw-sw)/2,sy=(vh-sh)/2;ctx.save();ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(video,sx,sy,sw,sh,0,0,w,h);ctx.restore();shot=document.createElement('canvas');shot.width=w;shot.height=h;shot.getContext('2d').drawImage(photo,0,0);video.classList.add('hidden');photo.classList.remove('hidden');}function scorePick(){const arr=new Uint32Array(1);if(crypto?.getRandomValues){crypto.getRandomValues(arr);return 80+(arr[0]%15)}return 80+Math.floor(Math.random()*15)}function confetti(){const root=$('sparkles');root.replaceChildren();for(let i=0;i<28;i++){const s=document.createElement('span');s.textContent=i%3?'♥':'✦';s.style.left=(5+Math.random()*90)+'%';s.style.top=(60+Math.random()*35)+'%';s.style.color=i%2?'#ff8eb6':'#eac18c';s.style.animationDelay=Math.random()*.5+'s';root.appendChild(s)}setTimeout(()=>root.replaceChildren(),3400)}async function run(){if(busy)return;busy=true;shoot.disabled=true;try{capture();$('flash').classList.add('go');sound(850,.13);await sleep(400);stage.classList.add('scanning');$('stageLabel').textContent='';for(let i=0;i<5;i++){ $('scanText').textContent=['FACE DETECTING...','HEART SYNC...','LOVE FREQUENCY...','CALCULATING...','FINALIZING...'][i];sound(350+i*85,.1);await sleep(680)}stage.classList.remove('scanning');score=scorePick();$('score').textContent='♡ '+score+'%';$('message').textContent=score>=90?'運命級の相性！♡':score>=85?'最高のコンビ♡':'今夜は急接近の予感♡';$('resultPhoto').src=shot.toDataURL('image/jpeg',.92);$('cameraSection').classList.add('hidden');$('result').classList.add('show');sound(950,.32);confetti()}catch(e){status.textContent=e.message;retry.classList.remove('hidden')}finally{busy=false;shoot.disabled=false}}function drawResult(){const c=document.createElement('canvas');c.width=1080;c.height=1660;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,1080,1660);g.addColorStop(0,'#261023');g.addColorStop(.65,'#100b17');g.addColorStop(1,'#09080b');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.textAlign='center';x.fillStyle='#e2bc81';x.font='bold 30px sans-serif';x.fillText('LOUNGE MARE',540,92);x.fillStyle='#fff';x.font='bold 75px sans-serif';x.fillText('LOVE SCAN ♡',540,180);x.drawImage(shot,90,235,900,1200);x.fillStyle='#170d1de8';x.fillRect(90,1220,900,215);x.fillStyle='#ff9fc4';x.font='bold 106px sans-serif';x.fillText('♡ '+score+'%',540,1330);x.fillStyle='#fff';x.font='bold 35px sans-serif';x.fillText($('message').textContent,540,1390);x.fillStyle='#dcb77e';x.font='bold 28px sans-serif';x.fillText('MARE LOVE SCAN',540,1510);x.fillStyle='#bca7b7';x.font='22px sans-serif';x.fillText('FOR ENTERTAINMENT ONLY',540,1555);return c}function save(){const c=drawResult();c.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MARE_LOVE_SCAN_'+score+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)},'image/png')}function reset(){stage.classList.remove('scanning');$('flash').classList.remove('go');$('result').classList.remove('show');$('cameraSection').classList.remove('hidden');video.classList.remove('hidden');photo.classList.add('hidden');$('stageLabel').textContent='2人でインカメに映ってね ♡';retry.classList.add('hidden');if(!stream||!stream.active)startCamera();else shoot.disabled=false}shoot.addEventListener('click',run);$('save').addEventListener('click',save);$('again').addEventListener('click',reset);retry.addEventListener('click',reset);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!stream?.active&&!busy&&$('result').classList.contains('show')===false)startCamera()});startCamera();})();
</script></body></html>
